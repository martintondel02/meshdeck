# Flatpak manifest for MeshDeck.
#
# STATUS: verified on Fedora 44 (2026-10-19) with org.flatpak.Builder 1.4.9
# (installed user-level from Flathub) and the freedesktop 26.08 runtime/SDK.
# `flatpak run org.meshdeck.MeshDeck --version` prints the release version and
# the installed app serves the UI + authenticated API (with AutoInterface
# disabled — see the note below). The manifest's build sandbox needs
# `--share=network` for pip (added in build-options).
#
# It builds from the source tree (no PyPI release needed) with pip into /app.
#
# NOTE: the freedesktop SDK has no Node/pnpm, so the web UI cannot be built
# inside the sandbox. The source tree passed to flatpak-builder must already
# contain a built frontend/dist (`make build-frontend`); the build command below
# copies it next to the installed package where resolve_static_dir() looks.
# A clean git clone without that directory would install without a UI.
# The type: dir source copies the whole working tree, so build from a clean
# copy (without .venv/ or node_modules/) to keep the build context small.
#
# KNOWN LIMITATION (verified): the default AutoInterface does not start inside
# the Flatpak sandbox on this host (RNS exits 255 before logging a reason).
# MeshDeck still boots and serves its UI/API when AutoInterface is disabled or
# a TCP interface is configured through the app. Do not claim "Flatpak network
# discovery works" until that is diagnosed.
app-id: org.meshdeck.MeshDeck
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: meshdeck

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

# flatpak-builder disables network access inside the build sandbox by default;
# pip needs it to fetch hatchling and the runtime dependencies.
build-options:
  build-args:
    - --share=network

modules:
  - name: meshdeck
    buildsystem: simple
    build-commands:
      # Install the Python package and all deps into /app (no PyPI release).
      - python3 -m pip install --no-cache-dir --prefix=/app .
      # Place the prebuilt web UI where meshdeck resolves static files.
      # (Compute the /app site-packages path; importing meshdeck here would see
      # the source tree in the CWD, not the installed copy.)
      - |
        UI_DIR="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base": "/app", "platbase": "/app"}))')/frontend/dist"
        install -d "$UI_DIR"
        cp -a frontend/dist/. "$UI_DIR/"
      # Desktop entry + icon, exported under the Flatpak app ID.
      - install -Dm644 packaging/meshdeck.desktop /app/share/applications/org.meshdeck.MeshDeck.desktop
      - install -Dm644 packaging/meshdeck.svg /app/share/icons/hicolor/scalable/apps/org.meshdeck.MeshDeck.svg
      - install -Dm644 packaging/meshdeck.svg /app/share/icons/hicolor/scalable/apps/meshdeck.svg
      - sed -i 's|^Icon=.*|Icon=org.meshdeck.MeshDeck|' /app/share/applications/org.meshdeck.MeshDeck.desktop
    sources:
      - type: dir
        path: ../..
